<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Maps</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/maps.css">
</head>

<body class="maps-page">

<nav id="main-navigation"></nav>

<main>

    <h1>Maps</h1>

    <p>
        Browse every map and switch instantly between floors using the elevator.<br>
        you need log for use creation marker and vote for add it on map.<br>
        rule is 10vote and 80% good vote for all see it.        
    </p>


    <div id="map-selector"></div>


    <div class="maps-layout">

        <!-- Elevator -->
        <aside id="map-elevator"></aside>


        <!-- Map Viewer -->
        <section class="map-viewer">

            <div id="map-container">

                <img id="map-image" src="" alt="Map">

                <div id="map-layer"></div>


                <!-- Marker Creation Menu -->
                <div id="action-modal" class="hidden">

                    <div class="action-box">

                        <div id="action-title"></div>

                        <div id="action-content"></div>

                        <div class="action-buttons">

                            <button id="action-cancel">
                            Cancel
                            </button>

                            <button id="action-confirm">
                            Confirm
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- Legend -->
        <aside id="map-legend"></aside>

    </div>


</main>


<!-- Action Modal -->

<div id="action-modal" class="hidden">

    <div class="action-box">

        <div id="action-title"></div>

        <div id="action-content"></div>


        <div class="action-buttons">

            <button id="action-cancel">
                Cancel
            </button>

            <button id="action-confirm">
                Confirm
            </button>

        </div>

    </div>

</div>


<script type="module" src="../js/main.js"></script>
<script type="module" src="maps.js"></script>

</body>

</html>
