<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Maps</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/maps.css">
</head>

<body class="maps-page">

<nav id="main-navigation"></nav>

<main>

    <h1>Maps</h1>

    <p>
        Browse every map and switch instantly between floors using the elevator.
    </p>


    <div id="map-selector"></div>


    <div class="maps-layout">

        <!-- Elevator -->
        <aside id="map-elevator"></aside>


        <!-- Map Viewer -->
        <section class="map-viewer">

            <div id="map-container">

                <img id="map-image" src="" alt="Map">

                <div id="map-layer"></div>


                <!-- Marker Creation Menu -->
                <div id="marker-menu" class="hidden">

                    <input id="marker-description" type="text" placeholder="Add a description...">
                    <button data-type="door">Door</button>
                    <button data-type="rope">Rope</button>
                    <button data-type="door_need_key">Door Need Key</button>
                    <button data-type="entrance_exit_door">Entrance / Exit Door</button>
                    <button data-type="entrance_exit_elevator">Entrance / Exit Elevator</button>
                    <button data-type="exit_door">Exit Door</button>
                    <button data-type="exit_elevator">Exit Elevator</button>
                    <button data-type="exit_rope">Exit Rope</button>
                    <button data-type="harrow">Harrow</button>
                    <button data-type="lever">Lever</button>
                    <button data-type="button">Button</button>
                    <button data-type="boss">Boss</button>
                    <button data-type="big_mob_spawn">Big Mob Spawn</button>
                    <button data-type="chest">Chest</button>
                    <button data-type="body">armor_stand</button>
                    <button data-type="body">Body</button>

                </div>

            </div>

        </section>


        <!-- Legend -->
        <aside id="map-legend"></aside>

    </div>


</main>


<!-- Action Modal -->

<div id="action-modal" class="hidden">

    <div class="action-box">

        <div id="action-title"></div>

        <div id="action-content"></div>


        <div class="action-buttons">

            <button id="action-cancel">
                Cancel
            </button>

            <button id="action-confirm">
                Confirm
            </button>

        </div>

    </div>

</div>


<script type="module" src="../js/main.js"></script>
<script type="module" src="maps.js"></script>

</body>

</html>
