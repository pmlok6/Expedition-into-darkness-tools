<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maps</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/maps.css">
</head>

<body class="maps-page">

    <nav id="main-navigation"></nav>

    <main>
        <h1>Maps</h1>
        <p>Browse every map and switch instantly between floors using the elevator.</p>
        <div id="map-selector"></div>
        <div class="maps-layout">
            <aside id="map-elevator"></aside>
            <section class="map-viewer">
                <div id="map-container">
                    <img id="map-image" src="" alt="Map">
                    <div id="map-layer"></div>
                </div>
            </section>
        </div>
        <div id="marker-menu" class="hidden">
            <button data-type="chest"> Coffre</button>
            <button data-type="monster"> Monstre</button>
            <button data-type="resource"> Ressource</button>
        </div>
    </main>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="maps.js"></script>

</body>
</html>
