<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Leveling</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/leveling.css">
	<link rel="stylesheet" href="../css/navigation.css">
</head>

<body>
	<nav id="main-navigation"></nav>
	<div id="leveling-page">
		<h1>Leveling</h1>
		<p>	A simple tool to show you the current level and the experience required between levels—nothing more.</p>
		<div class="level-box">
			<h2>Level Table</h2>
			<table 
				class="wikitable sortable"
				id="xp-table">
				<thead>
					<tr>
						<th>Level</th>          
						<th>total XP</th>	
						<th>XP to next level</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
		</div>
		<div class="level-box">
			<h2>Level Curve</h2>
			<div id="xp-chart"></div>
		</div>
	</div>
	<script type="module" src="../js/main.js"></script>
	<script src="leveling.js"></script>

	<footer id="site-footer">

    <div class="footer-studio">
        <img src="assets/logo.png" alt="Studio logo">
    </div>

    <div class="footer-credit">
        <a href="credits.html">Credits</a>
    </div>

</footer>
</body>
</html>
