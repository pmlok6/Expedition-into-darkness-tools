<!DOCTYPE html>
<html lang="en">
<head>

	<meta charset="UTF-8">
	<title>Leveling</title>

	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/leveling.css">
	<link rel="stylesheet" href="../css/navigation.css">
</head>

<body>
<main class="leveling-page">
	<h1>Leveling</h1>
	<p>	A simple tool to show you the current level and the experience required between levels—nothing more.</p>
	<section>
		<h2>Level Table</h2>
	<table 
			class="wikitable sortable"
			id="xp-table">
			<thead>
				<tr>
					<th>Level</th>          
					<th>total XP</th>	
					<th>XP to next level</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
		</table>
	</section>
	<section>
		<h2>	Level Curve		</h2>
		<div id="xp-chart">	</div>
	</section>
</main>
<script type="module" src="../js/main.js"></script>
<script src="leveling.js"></script>
</body>
</html>
