<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/login.css">

</head>
<body>

<!-- Navigation si tu l'utilises -->
<div id="main-navigation"></div>

<main class="login-container">
    <h1>Connexion</h1>

    <!-- OAuth -->
    <button id="github-login">
        Connexion avec GitHub
    </button>

    <button id="discord-login">
        Connexion avec Discord
    </button>

    <div class="separator">
        ou
    </div>
    <!-- Email -->
    <input 
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Mot de passe"
    >

    <button id="signup">
        Créer un compte
    </button>

    <button id="login">
        Connexion
    </button>

    <button id="logout">
        Déconnexion
    </button>

</main>

<script type="module" src="js/main.js"></script>
<script type="module" src="./js/auth.js"></script>

</body>

</html>
